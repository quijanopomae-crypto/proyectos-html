name: Cliente 001 - comprobaciones sin nube
on:
  push:
    branches: [main]
    paths:
      - POS/js/sync/hosted-canonical-guard.js
      - tests/client-001/**
      - infra/database/migrations/**
      - scripts/client-001-migrate/**
      - tools/cloudflare-prod/wrangler.turso.jsonc
      - tools/cloudflare-lab/src/a6-canonical.js
      - tools/cloudflare-lab/src/client-001-canon-init.js
      - tools/cloudflare-lab/src/worker.js
      - tools/cloudflare-lab/src/turso-d1-adapter.js
      - tools/cloudflare-lab/src/database-binding.js
      - .github/workflows/cliente-001-offline-ci.yml
  pull_request:
    paths:
      - POS/js/sync/hosted-canonical-guard.js
      - tests/client-001/**
      - infra/database/migrations/**
      - scripts/client-001-migrate/**
      - tools/cloudflare-prod/wrangler.turso.jsonc
      - tools/cloudflare-lab/src/a6-canonical.js
      - tools/cloudflare-lab/src/client-001-canon-init.js
      - tools/cloudflare-lab/src/worker.js
      - tools/cloudflare-lab/src/turso-d1-adapter.js
      - tools/cloudflare-lab/src/database-binding.js
      - .github/workflows/cliente-001-offline-ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Leer codigo del Cliente 001
        uses: actions/checkout@v4
      - name: Instalar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Probar activacion y host del cliente
        run: node --test tests/client-001/hosted-guard.test.mjs
      - name: Probar contrato Turso sin acceso a cuenta remota
        run: node --test tools/cloudflare-lab/test/turso-d1-adapter.test.mjs
      - name: Comprobar migraciones en SQLite descartable
        run: python3 tests/client-001/migraciones_sqlite.py
      - name: Probar inicializacion CANON de tienda vacia
        run: node --test tests/client-001/canon-initialization.test.mjs
      - name: Validar sintaxis del migrador y verificador Turso
        run: |
          node --check scripts/client-001-migrate/migrate.mjs
          node --check scripts/client-001-migrate/verify-temporary.mjs
      - name: Confirmar configuracion sin D1 real ni runtime activo
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path("tools/cloudflare-prod/wrangler.jsonc")
          config=json.loads(p.read_text())
          assert config['name']=='cliente-001-pos-api'
          assert config['vars']['CANONICAL_RUNTIME_ENABLED']=='disabled'
          assert config['d1_databases'][0]['database_name']=='cliente-001-pos-db'
          assert config['d1_databases'][0]['database_id']=='REEMPLAZAR_CON_D1_EXCLUSIVA_DEL_CLIENTE'
          turso=json.loads(Path("tools/cloudflare-prod/wrangler.turso.jsonc").read_text())
          assert turso['name']=='cliente-001-pos-api'
          assert turso['vars']['DB_PROVIDER']=='turso'
          assert turso['vars']['CANONICAL_RUNTIME_ENABLED']=='disabled'
          assert 'd1_databases' not in turso
          assert sorted(turso['secrets']['required']) == sorted(['TURSO_DATABASE_URL','TURSO_AUTH_TOKEN','POS_ACTIVATION_SECRET'])
          assert 'TURSO_AUTH_TOKEN' not in turso.get('vars', {})
          assert 'TURSO_DATABASE_URL' not in turso.get('vars', {})
          assert 'POS_ACTIVATION_SECRET' not in turso.get('vars', {})
          print('D1 en espera y Turso preparado sin secretos ni escrituras dobles: OK')
          PY
